name: build test
on:
  pull_request:
    branches: [ "main" ]
jobs:
  windows_builds:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@main
    - name: build
      shell: cmd
      run: |
         call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
         cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
         ninja -C build
